<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/app-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Página não encontrada — Compra Fácil</title>
    <style>
      body { display: grid; min-height: 100vh; place-items: center; padding: 24px; text-align: center; }
      .not-found { max-width: 520px; }
      .not-found img { width: 96px; margin: 0 auto 22px; border-radius: 50%; }
      .not-found h1 { margin-bottom: 10px; font-size: clamp(2rem, 8vw, 4rem); }
      .not-found p { margin-bottom: 24px; color: #607069; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <img src="/assets/app-icon.png" alt="" />
      <h1>Esse caminho não existe.</h1>
      <p>Mas encontrar o que você precisa no Compra Fácil continua simples.</p>
      <a class="button button-primary" href="/">Voltar ao início</a>
    </main>
  </body>
</html>
